    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080b11;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #080b11;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .cyber-grid {
            background-size: 36px 36px;
            background-image:
                linear-gradient(to right, rgba(31, 41, 61, 0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(31, 41, 61, 0.22) 1px, transparent 1px);
        }

        .scanner-laser {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, #ef4444, transparent);
            animation: laserSweep 4s ease-in-out infinite;
            z-index: 9999;
            pointer-events: none;
        }

        @keyframes laserSweep {
            0% {
                top: 0%;
                opacity: 0.8;
            }

            50% {
                top: 100%;
                opacity: 1;
            }

            100% {
                top: 0%;
                opacity: 0.8;
            }
        }

        /* POP-UP & MODAL ANIMATIONS */
        .animate-backdrop-fade {
            animation: backdropFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes backdropFade {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .animate-modal-pop {
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.82) translateY(24px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-toast-slide {
            animation: toastSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastSlide {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.92);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-receipt-pop {
            animation: receiptPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes receiptPop {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.94);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hologram-card {
            background: linear-gradient(135deg, #111726 0%, #151f33 50%, #0d1322 100%);
            position: relative;
            overflow: hidden;
        }

        .leaflet-popup-content-wrapper {
            background: #111726 !important;
            color: #e2e8f0 !important;
            border: 1px solid #1f293d !important;
            border-radius: 8px !important;
        }

        .leaflet-popup-tip {
            background: #111726 !important;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #printableReceipt,
            #printableReceipt * {
                visibility: visible;
            }

            #printableReceipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
                border: 2px solid #000 !important;
                box-shadow: none !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

        }

        // ================= 2. CITIZEN PORTAL VIEW (WITH ANIMATED MODALS & RECEIPT) =================
        function CitizenPortalView({ onNavigate, onSubmitCase }) {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [showWarningModal, setShowWarningModal] = useState(false);
            const [penaltyAcknowledged, setPenaltyAcknowledged] = useState(false);
            const [caseSubmitted, setCaseSubmitted] = useState(false);
            const [receiptData, setReceiptData] = useState(null);

            const [pinnedCoords, setPinnedCoords] = useState([40.7128, -74.0060]);
            const citizenMapRef = useRef(null);
            const citizenMapInst = useRef(null);
            const citizenMarkerRef = useRef(null);

            const [citizenUser, setCitizenUser] = useState({
                name: "John Doe",
                email: "citizen.john@mail.com",
                phone: "+1 (555) 019-2849",
                nationalId: "NAT-ID-884920"
            });

            const [caseForm, setCaseForm] = useState({
                crimeCategory: "Cyber Financial Fraud & Scam",
                incidentLocation: "Financial District, Sector 4 (GPS: 40.7128, -74.0060)",
                incidentDescription: "Unauthorized extraction of funds through phishing scam.",
                emergencyThreat: true
            });

            useEffect(() => {
                if (!isLoggedIn || caseSubmitted || !citizenMapRef.current) return;

                if (!citizenMapInst.current) {
                    const map = L.map(citizenMapRef.current, {
                        center: pinnedCoords,
                        zoom: 13,
                        zoomControl: true
                    });
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

                    const pinIcon = L.divIcon({
                        className: 'citizen-pin',
                        html: `<div style="width:26px;height:26px;background:#38bdf8;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;box-shadow:0 0 12px #38bdf8;"><i class="fa-solid fa-location-dot text-xs"></i></div>`,
                        iconSize: [26, 26],
                        iconAnchor: [13, 13]
                    });

                    const marker = L.marker(pinnedCoords, { icon: pinIcon, draggable: true }).addTo(map);
                    citizenMarkerRef.current = marker;

                    map.on('click', (e) => {
                        const { lat, lng } = e.latlng;
                        marker.setLatLng([lat, lng]);
                        setPinnedCoords([lat, lng]);
                        setCaseForm(prev => ({
                            ...prev,
                            incidentLocation: `Sector GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`
                        }));
                    });

                    marker.on('dragend', () => {
                        const pos = marker.getLatLng();
                        setPinnedCoords([pos.lat, pos.lng]);
                        setCaseForm(prev => ({
                            ...prev,
                            incidentLocation: `Sector GPS (${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)})`
                        }));
                    });

                    citizenMapInst.current = map;
                }
            }, [isLoggedIn, caseSubmitted]);

            const handleLogin = (e) => {
                e.preventDefault();
                setShowWarningModal(true);
            };

            const handleAcknowledgeAndProceed = () => {
                if (!penaltyAcknowledged) {
                    alert("You must acknowledge the legal penalty declaration.");
                    return;
                }
                setShowWarningModal(false);
                setIsLoggedIn(true);
            };

            const handleCaseSubmit = (e) => {
                e.preventDefault();
                const cid = "RAK-" + Math.floor(100000 + Math.random() * 900000);
                const receiptNo = "REC-2026-" + Math.floor(10000 + Math.random() * 90000) + "-E";
                const shaSignature = "SHA256: " + Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');

                const fullReceipt = {
                    receiptNumber: receiptNo,
                    caseId: cid,
                    timestamp: new Date().toLocaleString(),
                    complainantName: citizenUser.name,
                    email: citizenUser.email,
                    phone: citizenUser.phone,
                    nationalId: citizenUser.nationalId,
                    crimeCategory: caseForm.crimeCategory,
                    incidentLocation: caseForm.incidentLocation,
                    coords: pinnedCoords,
                    summary: caseForm.incidentDescription,
                    assignedStation: "Metropolitan Central Precinct Sector 04",
                    status: "E-FIR Registered & Logged in RAKSHAK Police Database",
                    digitalSignature: shaSignature
                };

                setReceiptData(fullReceipt);
                onSubmitCase({
                    caseId: cid,
                    receiptNo: receiptNo,
                    complainantName: citizenUser.name,
                    nationalId: citizenUser.nationalId,
                    coords: pinnedCoords,
                    title: caseForm.crimeCategory,
                    ...caseForm
                });
                setCaseSubmitted(true);
            };

            return (
                <div className="max-w-4xl mx-auto px-6 py-10">

                    {/* STEP A: Login */}
                    {!isLoggedIn && (
                        <div className="bg-[#0c111d] border border-[#1f293d] rounded-3xl p-7 sm:p-10 shadow-2xl space-y-6 max-w-xl mx-auto animate-modal-pop">
                            <div className="text-center">
                                <div className="w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/30 text-sky-400 flex items-center justify-center text-3xl mx-auto mb-4">
                                    <i className="fa-solid fa-user-shield"></i>
                                </div>
                                <h2 className="text-2xl sm:text-3xl font-black text-white">Citizen Portal Sign-In</h2>
                                <p className="text-xs sm:text-sm text-slate-400 mt-1.5">Sign in with your email to file a complaint, pin your incident on the map, and get an official RAKSHAK E-Receipt.</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4 text-xs sm:text-sm">
                                <div>
                                    <label className="text-slate-300 block mb-1 font-medium">Email / Citizen ID *</label>
                                    <input required value={citizenUser.email} onChange={e => setCitizenUser({ ...citizenUser, email: e.target.value })} className="w-full bg-[#111726] border border-[#1f293d] rounded-xl p-3 text-white font-mono" />
                                </div>
                                <div>
                                    <label className="text-slate-300 block mb-1 font-medium">Password *</label>
                                    <input type="password" required defaultValue="••••••••••••" className="w-full bg-[#111726] border border-[#1f293d] rounded-xl p-3 text-white" />
                                </div>
                                <button type="submit" className="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 text-white font-mono font-bold text-sm shadow-lg shadow-sky-600/30 transition transform active:scale-95">
                                    LOGIN TO REPORT INCIDENT
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ================= ANIMATED FALSE CASE WARNING POP-UP ================= */}
                    {showWarningModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-backdrop-fade">
                            <div className="bg-[#0f1626] border-2 border-red-500 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl shadow-red-950/60 space-y-4 animate-modal-pop">
                                <div className="flex items-center gap-3 pb-3 border-b border-red-500/30">
                                    <div className="w-12 h-12 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center text-2xl flex-shrink-0 animate-bounce">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                    </div>
                                    <div>
                                        <span className="text-xs font-mono text-red-400 font-bold bg-red-950 px-2 py-0.5 rounded border border-red-800 uppercase">LEGAL STATUTORY WARNING</span>
                                        <h3 className="text-lg font-black text-white mt-1">Penalty For Filing False Cases</h3>
                                    </div>
                                </div>

                                <div className="text-xs sm:text-sm text-slate-300 space-y-2 leading-relaxed">
                                    <p>Under <strong>Section 182 & 211 Penal Code (False Allegations)</strong> and <strong>RAKSHAK Law Enforcement Act</strong>:</p>
                                    <div className="p-3.5 rounded-xl bg-red-950/40 border border-red-900 text-xs font-mono text-slate-200 space-y-2">
                                        <div>⚖️ <strong>CRIMINAL ACTION:</strong> Immediate prosecution for fabricated complaints.</div>
                                        <div>💵 <strong>FINANCIAL PENALTY:</strong> Mandatory civil penalty of up to <strong>$10,000 / ₹50,000</strong> plus taskforce deployment costs.</div>
                                        <div>🔒 <strong>IMPRISONMENT:</strong> Up to <strong>2 Years Imprisonment</strong> upon conviction.</div>
                                    </div>
                                </div>

                                <div className="p-3.5 rounded-xl bg-[#111726] border border-[#1f293d]">
                                    <label className="flex items-start gap-2.5 text-xs text-slate-200 cursor-pointer">
                                        <input type="checkbox" checked={penaltyAcknowledged} onChange={e => setPenaltyAcknowledged(e.target.checked)} className="mt-0.5 text-red-500 w-4 h-4" />
                                        <span>I certify this report is accurate. I acknowledge that <strong>filing a false case carries heavy penalties and criminal prosecution</strong>.</span>
                                    </label>
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setShowWarningModal(false)} className="px-4 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-xs font-mono transition hover:bg-slate-800">Cancel</button>
                                    <button onClick={handleAcknowledgeAndProceed} disabled={!penaltyAcknowledged} className="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 disabled:opacity-40 text-white font-mono text-xs font-bold transition shadow-lg shadow-red-600/30 transform active:scale-95">
                                        Acknowledge & Proceed
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* STEP C: Case Registration Form with Interactive GPS Map Picker */}
                    {isLoggedIn && !caseSubmitted && (
                        <div className="bg-[#0c111d] border border-[#1f293d] rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 animate-modal-pop">
                            <div className="flex justify-between items-center border-b border-[#1f293d] pb-4">
                                <div>
                                    <h2 className="text-xl sm:text-2xl font-black text-white">E-FIR Incident Registration & GPS Mapping</h2>

                            <form onSubmit={handleCaseSubmit} className="space-y-5 text-xs sm:text-sm">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-slate-300 block mb-1 font-medium">Complainant Full Name *</label>
                                        <input required value={citizenUser.name} onChange={e => setCitizenUser({ ...citizenUser, name: e.target.value })} className="w-full bg-[#111726] border border-[#1f293d] rounded-xl p-3 text-white" />
                                    </div>
                                    <div>
                                        <label className="text-slate-300 block mb-1 font-medium">National ID / Aadhaar / SSN *</label>

                                    </div>
                                </div>

                                <div>
                                    <label className="text-slate-300 block mb-1 font-medium">Crime Category *</label>
                                    <select value={caseForm.crimeCategory} onChange={e => setCaseForm({ ...caseForm, crimeCategory: e.target.value })} className="w-full bg-[#111726] border border-[#1f293d] rounded-xl p-3 text-white">
                                        <option value="Cyber Financial Fraud & Scam">Cyber Financial Fraud & Scam</option>
                                        <option value="Armed Robbery / Theft">Armed Robbery / Theft</option>
                                        <option value="Physical Assault / Threat">Physical Assault / Threat</option>
                                        <option value="Extortion / Blackmail">Extortion / Blackmail</option>
                                        <option value="Missing Person / Kidnapping">Missing Person / Kidnapping</option>
                                    </select>
                                </div>

                                {/* Interactive Leaflet Map Picker */}
                                <div className="space-y-2 p-4 rounded-2xl bg-slate-900/90 border border-[#1f293d]">
                                    <div className="flex justify-between items-center">
                                        <label className="text-sky-300 font-bold flex items-center gap-2 text-sm sm:text-base">
                                            <i className="fa-solid fa-map-pin text-red-400"></i>
                                            <span>Pin Exact Incident Location on Map *</span>
                                        </label>
                                        <span className="text-xs font-mono text-emerald-400 font-bold">
                                            GPS: {pinnedCoords[0].toFixed(4)}, {pinnedCoords[1].toFixed(4)}
                                        </span>
                                    </div>

                                    <p className="text-xs text-slate-400">
                                        Click anywhere on the map or drag the blue pin to mark the exact crime scene. This GPS location will be visible on the <strong>RAKSHAK Police Database</strong>.
                                    </p>

                                    <div className="relative h-64 rounded-xl overflow-hidden border border-slate-700">
                                        <div ref={citizenMapRef} className="w-full h-full"></div>
                                    </div>

                                    <input
                                        required
                                        value={caseForm.incidentLocation}
                                        onChange={e => setCaseForm({ ...caseForm, incidentLocation: e.target.value })}
                                        className="w-full bg-[#111726] border border-[#1f293d] rounded-xl p-3 text-white font-mono text-xs"
                                        placeholder="Address / Landmark description"
                                    />
                                </div>

                                <div>
                                    <label className="text-slate-300 block mb-1 font-medium">Incident Narrative Details *</label>
                                    <textarea rows={3} required value={caseForm.incidentDescription} onChange={e => setCaseForm({ ...caseForm, incidentDescription: e.target.value })} className="w-full bg-[#111726] border border-[#1f293d] rounded-xl p-3 text-white"></textarea>
                                </div>

                                <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                                    <div>
                                        <div className="font-bold text-white text-sm">Mark as High-Threat Emergency?</div>
                                        <div className="text-xs text-slate-400">Triggers priority dispatch in RAKSHAK Central Database</div>
                                    </div>
                                    <input type="checkbox" checked={caseForm.emergencyThreat} onChange={e => setCaseForm({ ...caseForm, emergencyThreat: e.target.checked })} className="w-5 h-5 text-red-500" />
                                </div>

                                <button type="submit" className="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 text-white font-mono font-bold text-sm shadow-lg shadow-sky-600/30 transition transform active:scale-95">
                                    SUBMIT OFFICIAL E-FIR & LOG GPS TO RAKSHAK DATABASE
                                </button>
                            </form>
                        </div>
                    )}

                    {/* STEP D: OFFICIAL DIGITAL E-RECEIPT (ANIMATED ENTRANCE) */}
                    {caseSubmitted && receiptData && (

            const filteredCases = useMemo(() => {
                return cases.filter(c => {
                    const matchCat = categoryFilter === "All" || c.category.toLowerCase() === categoryFilter.toLowerCase();

                        c.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        c.location.toLowerCase().includes(searchTerm.toLowerCase()) ||

                        zoomControl: false

                <i class="fa-solid fa-crosshairs"></i>

        function DashboardView({ cases, currentUser, onNavigate, showToast }) {
            const [selectedCase, setSelectedCase] = useState(cases[0] || null);
            const mapRef = useRef(null);
            const mapInst = useRef(null);
            const markersRef = useRef([]);

            useEffect(() => {
                if (!mapRef.current) return;
                if (!mapInst.current) {
                    const map = L.map(mapRef.current, { center: [40.7428, -73.9960], zoom: 12, zoomControl: false });
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
                    mapInst.current = map;
                }
                const map = mapInst.current;
                markersRef.current.forEach(m => map.removeLayer(m));
                markersRef.current = [];

                cases.forEach(item => {
                    const markerColor = item.priority === "Critical" ? "#ef4444" : "#f97316";
                    const icon = L.divIcon({
                        html: `<div style="width:22px;height:22px;background:#0f172a;border:2px solid ${markerColor};border-radius:50%;color:${markerColor};display:flex;align-items:center;justify-content:center;font-size:11px;"><i class="fa-solid fa-crosshairs"></i></div>`,
                        iconSize: [22, 22],
                        iconAnchor: [11, 11]
                    });
                    const marker = L.marker(item.coords, { icon }).addTo(map);
                    marker.bindPopup(`<div class="text-xs p-1"><b class="text-sky-400">${item.id}</b><div class="text-white">${item.title}</div></div>`);
                    marker.on('click', () => setSelectedCase(item));

                            <button
                                onClick={() => onNavigate('database')}
                                className="px-4 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-mono text-xs sm:text-sm font-bold flex items-center gap-2 shadow-lg shadow-amber-600/30 transition transform active:scale-95"
                            >
                                <i className="fa-solid fa-database"></i> Open Police Database
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 h-[380px] rounded-2xl overflow-hidden border border-[#1f293d]">
                            <div ref={mapRef} className="w-full h-full"></div>
                        </div>

                        <div className="p-5 rounded-2xl bg-[#111726] border border-[#1f293d] space-y-3">
                            <span className="text-sm font-mono text-sky-400 font-bold block">ACTIVE DOSSIERS ({cases.length})</span>
                            <div className="space-y-2.5 max-h-[300px] overflow-y-auto pr-1 text-xs sm:text-sm">
                                {cases.map(c => (
                                    <div key={c.id} onClick={() => setSelectedCase(c)} className={`p-3.5 rounded-xl border cursor-pointer transition ${selectedCase?.id === c.id ? 'bg-[#151f33] border-sky-500 shadow-md' : 'bg-slate-900 border-slate-800'}`}>
                                        <div className="flex justify-between font-mono text-xs text-sky-400"><span>{c.id}</span><span>{c.priority}</span></div>
                                        <div className="font-bold text-white text-sm mt-0.5">{c.title}</div>
                                        <div className="text-slate-400 text-xs truncate mt-0.5">{c.location}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
